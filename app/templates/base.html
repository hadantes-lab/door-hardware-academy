<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Door Hardware Academy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.home') }}">
      <span class="brand-mark" aria-hidden="true"></span>Door Hardware Academy
    </a>
    {% block topbar_extra %}{% endblock %}
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="flash" role="status">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
