{% extends "base.html" %}
{% block title %}Sign in · Door Hardware Academy{% endblock %}
{% block content %}
  <section class="panel auth">
    <h1>Sign in</h1>
    <p class="muted">Pick up where you left off.</p>
    {% if error %}<div class="form-errors" role="alert"><p>{{ error }}</p></div>{% endif %}
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username"
             autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn wide" type="submit">Sign in</button>
    </form>
    <p class="switch">New here? <a href="{{ url_for('auth.signup', next=request.args.get('next')) }}">Create a free profile</a></p>
  </section>
{% endblock %}
