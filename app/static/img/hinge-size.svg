<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hinge height and width</title>
  <style>
    .leaf{fill:#cfd6dd;stroke:#3b4752;stroke-width:2}
    .knuckle{fill:#aeb8c2;stroke:#3b4752;stroke-width:2}
    .dim{stroke:#c2410c;stroke-width:2;fill:none}
    .lbl{font:600 14px system-ui,sans-serif;fill:#1f2933}
    .big{font:700 16px system-ui,sans-serif;fill:#c2410c}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#c2410c"/></marker></defs>
  <rect class="leaf" x="150" y="50" width="80" height="180" rx="3"/>
  <rect class="leaf" x="254" y="50" width="80" height="180" rx="3"/>
  <rect class="knuckle" x="230" y="50" width="24" height="180" rx="6"/>
  <!-- height -->
  <path class="dim" d="M135 50 L135 230" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="big" x="20" y="135">Height</text><text class="lbl" x="20" y="155">first</text><text class="lbl" x="20" y="173">number</text>
  <!-- width -->
  <path class="dim" d="M150 260 L334 260" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="big" x="190" y="288">Width (open)</text>
  <text class="lbl" x="350" y="130">4-1/2" × 4-1/2"</text><text class="lbl" x="350" y="150">= height × width</text>
</svg>
