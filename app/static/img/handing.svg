<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Door handing viewed from the outside</title>
  <style>
    .wall{fill:#9aa5b1}
    .door{stroke:#3b4752;stroke-width:5;stroke-linecap:round}
    .arc{fill:none;stroke:#c2410c;stroke-width:1.5;stroke-dasharray:4 4}
    .hinge{fill:#c2410c}
    .lbl{font:700 16px system-ui,sans-serif;fill:#1f2933}
    .sub{font:12px system-ui,sans-serif;fill:#52606d}
    .you{font:600 11px system-ui,sans-serif;fill:#0b6e4f}
  </style>
  <!-- Plan views. Wall is horizontal; INSIDE is above the wall, OUTSIDE (where you stand) is below. -->
  <!-- LH: hinge left, swings away (up, into inside) -->
  <g transform="translate(20,20)">
    <rect class="wall" x="0" y="100" width="20" height="10"/><rect class="wall" x="100" y="100" width="20" height="10"/>
    <line class="door" x1="20" y1="100" x2="20" y2="20"/>
    <path class="arc" d="M100 100 A80 80 0 0 0 20 20"/>
    <circle class="hinge" cx="20" cy="100" r="5"/>
    <text class="you" x="35" y="135">YOU (outside)</text>
    <text class="lbl" x="0" y="160">LH</text><text class="sub" x="30" y="160">hinge left, swings away</text>
  </g>
  <!-- RH -->
  <g transform="translate(280,20)">
    <rect class="wall" x="0" y="100" width="20" height="10"/><rect class="wall" x="100" y="100" width="20" height="10"/>
    <line class="door" x1="100" y1="100" x2="100" y2="20"/>
    <path class="arc" d="M20 100 A80 80 0 0 1 100 20"/>
    <circle class="hinge" cx="100" cy="100" r="5"/>
    <text class="you" x="35" y="135">YOU (outside)</text>
    <text class="lbl" x="0" y="160">RH</text><text class="sub" x="30" y="160">hinge right, swings away</text>
  </g>
  <!-- LHR: hinge left, swings toward you (down) -->
  <g transform="translate(20,190)">
    <rect class="wall" x="0" y="20" width="20" height="10"/><rect class="wall" x="100" y="20" width="20" height="10"/>
    <line class="door" x1="20" y1="30" x2="20" y2="110"/>
    <path class="arc" d="M100 30 A80 80 0 0 1 20 110"/>
    <circle class="hinge" cx="20" cy="30" r="5"/>
    <text class="you" x="40" y="128">YOU (outside)</text>
    <text class="lbl" x="0" y="152">LHR</text><text class="sub" x="42" y="152">hinge left, swings toward you</text>
  </g>
  <!-- RHR -->
  <g transform="translate(280,190)">
    <rect class="wall" x="0" y="20" width="20" height="10"/><rect class="wall" x="100" y="20" width="20" height="10"/>
    <line class="door" x1="100" y1="30" x2="100" y2="110"/>
    <path class="arc" d="M20 30 A80 80 0 0 0 100 110"/>
    <circle class="hinge" cx="100" cy="30" r="5"/>
    <text class="you" x="22" y="128">YOU (outside)</text>
    <text class="lbl" x="0" y="152">RHR</text><text class="sub" x="42" y="152">hinge right, swings toward you</text>
  </g>
</svg>
