<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Plan views of four hinge mounting types</title>
  <style>
    .frame{fill:#e8dcc8;stroke:#6b5b45;stroke-width:1.5}
    .door{fill:#f3ead9;stroke:#6b5b45;stroke-width:1.5}
    .leaf{fill:#3b4752}
    .knuckle{fill:#3b4752}
    .lbl{font:700 14px system-ui,sans-serif;fill:#1f2933}
    .sub{font:12px system-ui,sans-serif;fill:#52606d}
  </style>
  <!-- Each panel: frame jamb on left, door on right, seen from above. Leaf in a mortise = inset into the edge. -->
  <!-- 1 Full mortise -->
  <g transform="translate(20,40)">
    <rect class="frame" x="0" y="20" width="40" height="70"/>
    <rect class="door" x="46" y="20" width="60" height="70"/>
    <rect class="leaf" x="34" y="30" width="6" height="40"/>
    <rect class="leaf" x="46" y="30" width="6" height="40"/>
    <circle class="knuckle" cx="43" cy="20" r="6"/>
    <text class="lbl" x="0" y="125">Full mortise</text>
    <text class="sub" x="0" y="143">Door edge +</text><text class="sub" x="0" y="159">frame edge</text>
  </g>
  <!-- 2 Half mortise -->
  <g transform="translate(150,40)">
    <rect class="frame" x="0" y="20" width="40" height="70"/>
    <rect class="door" x="46" y="20" width="60" height="70"/>
    <rect class="leaf" x="46" y="30" width="6" height="40"/>
    <rect class="leaf" x="0" y="14" width="40" height="6"/>
    <circle class="knuckle" cx="43" cy="14" r="6"/>
    <text class="lbl" x="0" y="125">Half mortise</text>
    <text class="sub" x="0" y="143">Door edge +</text><text class="sub" x="0" y="159">frame face</text>
  </g>
  <!-- 3 Half surface -->
  <g transform="translate(280,40)">
    <rect class="frame" x="0" y="20" width="40" height="70"/>
    <rect class="door" x="46" y="20" width="60" height="70"/>
    <rect class="leaf" x="34" y="30" width="6" height="40"/>
    <rect class="leaf" x="46" y="14" width="60" height="6"/>
    <circle class="knuckle" cx="43" cy="14" r="6"/>
    <text class="lbl" x="0" y="125">Half surface</text>
    <text class="sub" x="0" y="143">Frame edge +</text><text class="sub" x="0" y="159">door face</text>
  </g>
  <!-- 4 Full surface -->
  <g transform="translate(410,40)">
    <rect class="frame" x="0" y="20" width="40" height="70"/>
    <rect class="door" x="46" y="20" width="60" height="70"/>
    <rect class="leaf" x="0" y="14" width="40" height="6"/>
    <rect class="leaf" x="46" y="14" width="60" height="6"/>
    <circle class="knuckle" cx="43" cy="14" r="6"/>
    <text class="lbl" x="0" y="125">Full surface</text>
    <text class="sub" x="0" y="143">Door face +</text><text class="sub" x="0" y="159">frame face</text>
  </g>
  <text class="sub" x="20" y="250">Seen from above: frame on the left, door on the right, leaves shown in dark grey.</text>
</svg>
