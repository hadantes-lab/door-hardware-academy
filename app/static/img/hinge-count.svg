<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Number of hinges by door height</title>
  <style>
    .door{fill:#f3ead9;stroke:#6b5b45;stroke-width:2}
    .h{fill:#3b4752}
    .lbl{font:700 15px system-ui,sans-serif;fill:#1f2933}
    .sub{font:12px system-ui,sans-serif;fill:#52606d}
  </style>
  <!-- up to 60" -->
  <rect class="door" x="40" y="150" width="70" height="110"/>
  <rect class="h" x="36" y="162" width="8" height="18"/><rect class="h" x="36" y="230" width="8" height="18"/>
  <text class="lbl" x="40" y="285">2 hinges</text><text class="sub" x="125" y="210">up to 60"</text>
  <!-- 60-90 -->
  <rect class="door" x="200" y="80" width="70" height="180"/>
  <rect class="h" x="196" y="92" width="8" height="18"/><rect class="h" x="196" y="160" width="8" height="18"/><rect class="h" x="196" y="230" width="8" height="18"/>
  <text class="lbl" x="200" y="285">3 hinges</text><text class="sub" x="282" y="170">60"–90"</text>
  <!-- 90-120 -->
  <rect class="door" x="360" y="20" width="70" height="240"/>
  <rect class="h" x="356" y="32" width="8" height="18"/><rect class="h" x="356" y="100" width="8" height="18"/><rect class="h" x="356" y="168" width="8" height="18"/><rect class="h" x="356" y="230" width="8" height="18"/>
  <text class="lbl" x="360" y="285">4 hinges</text><text class="sub" x="436" y="140">90"–</text><text class="sub" x="436" y="156">120"</text>
</svg>
