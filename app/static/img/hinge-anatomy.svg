<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Butt hinge anatomy</title>
  <style>
    .leaf{fill:#cfd6dd;stroke:#3b4752;stroke-width:2}
    .knuckle{fill:#aeb8c2;stroke:#3b4752;stroke-width:2}
    .hole{fill:#fff;stroke:#3b4752;stroke-width:1.5}
    .lbl{font:600 14px system-ui,sans-serif;fill:#1f2933}
    .ln{stroke:#c2410c;stroke-width:1.5;fill:none}
    .dot{fill:#c2410c}
  </style>
  <!-- leaves -->
  <rect class="leaf" x="120" y="50" width="104" height="200" rx="4"/>
  <rect class="leaf" x="256" y="50" width="104" height="200" rx="4"/>
  <!-- knuckles: five, alternating -->
  <rect class="knuckle" x="224" y="50" width="32" height="40" rx="6"/>
  <rect class="knuckle" x="224" y="90" width="32" height="40" rx="6"/>
  <rect class="knuckle" x="224" y="130" width="32" height="40" rx="6"/>
  <rect class="knuckle" x="224" y="170" width="32" height="40" rx="6"/>
  <rect class="knuckle" x="224" y="210" width="32" height="40" rx="6"/>
  <!-- tips -->
  <rect class="knuckle" x="230" y="38" width="20" height="12" rx="3"/>
  <rect class="knuckle" x="230" y="250" width="20" height="12" rx="3"/>
  <!-- screw holes -->
  <circle class="hole" cx="160" cy="85" r="7"/><circle class="hole" cx="190" cy="150" r="7"/><circle class="hole" cx="160" cy="215" r="7"/>
  <circle class="hole" cx="320" cy="85" r="7"/><circle class="hole" cx="290" cy="150" r="7"/><circle class="hole" cx="320" cy="215" r="7"/>
  <!-- labels -->
  <circle class="dot" cx="150" cy="120" r="4"/><path class="ln" d="M150 120 L70 120"/><text class="lbl" x="20" y="125">Leaf</text>
  <circle class="dot" cx="240" cy="110" r="4"/><path class="ln" d="M240 110 L400 110"/><text class="lbl" x="405" y="115">Knuckle</text>
  <circle class="dot" cx="240" cy="44" r="4"/><path class="ln" d="M240 44 L400 30"/><text class="lbl" x="405" y="35">Tip</text>
  <circle class="dot" cx="240" cy="190" r="4"/><path class="ln" d="M240 190 L400 190"/><text class="lbl" x="405" y="185">Pin inside</text><text class="lbl" x="405" y="203">the barrel</text>
  <circle class="dot" cx="320" cy="215" r="4"/><path class="ln" d="M320 215 L400 260"/><text class="lbl" x="405" y="265">Screw hole</text>
</svg>
