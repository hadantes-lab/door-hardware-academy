<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Common BHMA finish swatches</title>
  <style>
    .sw{stroke:#3b4752;stroke-width:1}
    .code{font:700 15px system-ui,sans-serif;fill:#1f2933}
    .name{font:11px system-ui,sans-serif;fill:#52606d}
  </style>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4e7eb"/><stop offset="1" stop-color="#b8c0c8"/></linearGradient>
    <linearGradient id="ss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d5d8db"/><stop offset="1" stop-color="#a3a9ae"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3d2b"/><stop offset="1" stop-color="#2e1f16"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d26b"/><stop offset="1" stop-color="#b8892a"/></linearGradient>
  </defs>
  <g transform="translate(10,20)"><rect class="sw" width="64" height="64" rx="8" fill="url(#chrome)"/><text class="code" x="0" y="88">626</text><text class="name" x="0" y="104">Satin chrome</text><text class="name" x="0" y="118">(brass base)</text></g>
  <g transform="translate(88,20)"><rect class="sw" width="64" height="64" rx="8" fill="url(#chrome)"/><text class="code" x="0" y="88">652</text><text class="name" x="0" y="104">Satin chrome</text><text class="name" x="0" y="118">(steel base)</text></g>
  <g transform="translate(166,20)"><rect class="sw" width="64" height="64" rx="8" fill="url(#ss)"/><text class="code" x="0" y="88">630</text><text class="name" x="0" y="104">Satin stainless</text></g>
  <g transform="translate(244,20)"><rect class="sw" width="64" height="64" rx="8" fill="url(#orb)"/><text class="code" x="0" y="88">613</text><text class="name" x="0" y="104">Oil-rubbed</text><text class="name" x="0" y="118">bronze</text></g>
  <g transform="translate(322,20)"><rect class="sw" width="64" height="64" rx="8" fill="url(#brass)"/><text class="code" x="0" y="88">605</text><text class="name" x="0" y="104">Bright brass</text></g>
  <g transform="translate(400,20)"><rect class="sw" width="64" height="64" rx="8" fill="#8a9099"/><text class="code" x="0" y="88">600</text><text class="name" x="0" y="104">Primed for</text><text class="name" x="0" y="118">painting</text></g>
  <text class="name" x="10" y="180">Swatches are approximate; real finishes vary by maker and base metal.</text>
</svg>
