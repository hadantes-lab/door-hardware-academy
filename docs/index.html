/* Door Hardware Academy. Phone-first: one column, large touch targets,
   primary actions pinned to the bottom of the screen on lesson and quiz pages. */
:root {
  --ink: #1f2933;
  --muted: #52606d;
  --line: #d9dee3;
  --paper: #f6f4ef;
  --card: #ffffff;
  --figure: #fbfaf7;          /* diagrams are drawn for a light ground in both themes */
  --accent: #c2410c;          /* safety orange, matches the diagrams */
  --accent-press: #8a2e08;
  --accent-soft: #fff3ec;
  --ring: #fbd5c2;
  --accent-ink: #ffffff;
  --done: #0b6e4f;
  --locked: #9aa5b1;
  --flash: #fff4e5;
  --flash-line: #f5c07a;
  --error: #b42318;
  --error-soft: #fdecea;
  --radius: 14px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e7ebee;
    --muted: #a3adb7;
    --line: #353e47;
    --paper: #14181c;
    --card: #1e242a;
    --accent: #ea6a2e;
    --accent-press: #9a3a12;
    --accent-soft: #3a2418;
    --ring: #5a2c16;
    --done: #2fa37a;
    --locked: #5f6b76;
    --flash: #3a2c16;
    --flash-line: #7a5a26;
    --error: #ff8a7a;
    --error-soft: #3b1d1a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; line-height: 1.55; background: var(--paper); color: var(--ink); }
h1, h2 { line-height: 1.2; margin: 0 0 .4rem; text-wrap: balance; }
h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); }
h2 { font-size: 1.2rem; }
a { color: var(--accent); }
p { margin: 0 0 .75rem; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: .75rem;
  min-height: 56px;
  padding: calc(.5rem + env(safe-area-inset-top, 0px)) var(--gutter-r) .5rem var(--gutter-l);
  background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: .55rem; min-width: 0; }
.brand-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-mark { flex: none; width: 14px; height: 22px; border: 3px solid var(--ink); border-radius: 2px; position: relative; }
.brand-mark::after { content: ""; position: absolute; right: 1px; top: 8px; width: 3px; height: 3px; background: var(--accent); border-radius: 50%; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: .75rem; flex: none; }
.streak { font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.signin { font-weight: 700; text-decoration: none; padding: .5rem .25rem; }
.avatar {
  display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
  background: var(--done); color: #fff; font-weight: 700; text-decoration: none; flex: none;
}
.avatar.big { width: 64px; height: 64px; font-size: 1.6rem; }

/* Focus mode (lesson cards and quizzes): close button + progress */
.focus .topbar { gap: .9rem; }
.close {
  display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; flex: none;
  color: var(--muted); text-decoration: none; font-size: 1.3rem; border-radius: 50%;
}
.progress { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--done); border-radius: 999px; transition: width .3s; }
.step { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.topbar-title { flex: 1; font-weight: 700; }

/* Page body */
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 1rem 2.5rem;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: grid; gap: 1rem;
}
.focus .wrap { padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); }
.wrap > * { min-width: 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 700; color: var(--accent); margin: 0 0 .3rem; }
.muted { color: var(--muted); }
.small-note { font-size: .9rem; margin: .5rem 0 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.flash { background: var(--flash); border: 1px solid var(--flash-line); padding: .7rem .9rem; border-radius: 10px; margin: 0; }

/* Buttons: at least 48px tall for thumbs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
  background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer;
  padding: .7rem 1.4rem; border-radius: 999px; font: inherit; font-weight: 700; text-decoration: none;
  box-shadow: 0 3px 0 var(--accent-press); -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-press); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn.small { min-height: 40px; padding: .45rem 1rem; }
.btn.wide { width: 100%; }
.btn:focus-visible, a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible,
.option input:focus-visible + span, summary:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
.link { font-weight: 700; }

/* Cards and panels */
.today, .segment, .card, .score, .panel, .save-nudge {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem;
}
.segment-head { display: flex; justify-content: space-between; gap: 1rem; align-items: start; }
.segment.is-locked h2, .segment.is-locked .muted { opacity: .75; }
.count { font-weight: 600; color: var(--muted); margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: .5rem; }
.meter span { display: block; height: 100%; background: var(--done); }

.save-nudge { display: flex; gap: 1rem; align-items: center; justify-content: space-between; border-color: var(--ring); background: var(--accent-soft); }
.save-nudge p { margin: .2rem 0 0; color: var(--muted); }
.save-actions { display: flex; align-items: center; gap: 1rem; flex: none; }

/* Lesson path */
.path { list-style: none; margin: .75rem 0 0; padding: 0; }
.node { display: flex; align-items: center; gap: .8rem; min-height: 52px; position: relative; }
.node:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 46px; width: 2px; height: calc(100% - 40px); background: var(--line); }
.dot {
  width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; background: var(--card); border: 3px solid var(--locked); color: var(--locked);
}
.node.done .dot { background: var(--done); border-color: var(--done); color: #fff; }
.node.next .dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 5px var(--ring); }
.node-title { font-weight: 600; flex: 1; padding-block: .6rem; }
a.node-title { color: var(--ink); text-decoration: none; }
.node.next a.node-title { color: var(--accent); }
.node.locked .node-title { color: var(--locked); }
.best { font-size: .85rem; color: var(--muted); white-space: nowrap; }

/* Lesson card */
.card figure { margin: .5rem 0 1rem; background: var(--figure); border: 1px solid var(--line); border-radius: 10px; padding: .6rem; }
.card img { width: 100%; height: auto; display: block; }
.card figcaption { font-size: .8rem; color: #52606d; margin-top: .35rem; text-align: center; }
@media (min-width: 641px) { .card figcaption { display: none; } }
.card .body { font-size: 1.08rem; margin: 0; max-width: 65ch; }

/* Bottom action bar: pinned on phones, inline on wider screens */
.action-bar { display: flex; justify-content: space-between; gap: .75rem; }
.action-bar .btn { flex: 1; }
@media (max-width: 640px) {
  .action-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: .75rem var(--gutter-r) calc(.75rem + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
    background: var(--card); border-top: 1px solid var(--line);
  }
}
@media (min-width: 641px) {
  .action-bar .btn { flex: 0 1 auto; min-width: 9rem; }
  .quiz-form .action-bar { justify-content: flex-start; }
  .quiz-form .action-bar .btn.wide { width: auto; }
}

/* Quiz */
.quiz-form { display: grid; gap: 1rem; }
.question { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin: 0; min-width: 0; }
.question legend { font-weight: 600; padding: 0; margin-bottom: .5rem; display: flex; gap: .6rem; float: left; width: 100%; }
.question legend + * { clear: both; }
.qnum { flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--ink); color: var(--card); display: grid; place-items: center; font-size: .85rem; }
.option { display: block; margin-top: .5rem; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
.option input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.option span { display: flex; align-items: center; min-height: 52px; padding: .65rem .9rem; border: 2px solid var(--line); border-radius: 12px; border-bottom-width: 4px; }
.option input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* Results */
.score.pass { border-color: var(--done); box-shadow: inset 6px 0 0 var(--done); }
.score.fail { border-color: var(--accent); box-shadow: inset 6px 0 0 var(--accent); }
.score p:last-child { margin-bottom: 0; }
.review { padding-left: 1.2rem; margin: 0; display: grid; gap: 1rem; }
.review li { padding-left: .3rem; }
.review li.right::marker { color: var(--done); }
.review li.wrong::marker { color: var(--accent); }
.review p { margin: .2rem 0; }
.review .q { font-weight: 600; }

.auth { max-width: 460px; width: 100%; justify-self: center; }
.form { display: grid; gap: .35rem; margin-top: .5rem; }
.form label { font-weight: 600; margin-top: .6rem; }
.form input, .form select {
  font: inherit; font-size: 16px; /* 16px stops iOS zooming into fields */
  min-height: 48px; padding: .6rem .8rem; border: 2px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); width: 100%;
}
.form input:focus, .form select:focus { border-color: var(--accent); outline: none; }
.form .btn { margin-top: 1rem; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.optional { font-weight: 400; color: var(--muted); }
.form-errors { background: var(--error-soft); border: 1px solid var(--error); color: var(--ink); border-radius: 10px; padding: .6rem .9rem; }
.form-errors p { margin: .2rem 0; }
.switch { margin: 1rem 0 0; text-align: center; }

/* Profile */
.profile-head { display: flex; align-items: center; gap: 1rem; }
.profile-head h1 { margin: 0; }
.profile-head p { margin: .2rem 0 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem; display: grid; gap: .1rem; }
.stat .num { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .num small { font-size: .9rem; color: var(--muted); font-weight: 600; }
.stat .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.unit-list { list-style: none; padding: 0; margin: .5rem 0 0; display: grid; gap: 1rem; }
.unit-row { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.unit-status { color: var(--muted); font-size: .9rem; }
details.panel summary { font-weight: 700; cursor: pointer; min-height: 32px; }
.signout { justify-self: start; }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .save-nudge { flex-direction: column; align-items: stretch; }
  .save-actions { justify-content: space-between; }
  .btn.block-sm { width: 100%; }

@media (max-width: 420px) {
  .segment-head { flex-direction: column; gap: .2rem; }
  .streak-word { display: none; }
  .brand { font-size: .95rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

.transfer textarea { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; min-height: 96px; padding: .6rem .8rem; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; resize: vertical; }
.row-actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: .75rem; }
.confirm { border: 1px solid var(--error); background: var(--error-soft); border-radius: 10px; padding: .75rem .9rem; margin-top: .75rem; }
.note { font-size: .85rem; color: var(--muted); margin: .4rem 0 0; }
.footer { text-align: center; font-size: .8rem; color: var(--muted); padding: 0 0 1rem; }

3/4\"** thick; residential interior doors are usually 1-3/8\".","image":null,"alt":""},{"title":"Reading a door schedule","body":"A door schedule row lists the **opening number**, **size**, **door type and material**, **frame type**, **fire rating** and **hardware set**. For example: \"104A · 3070 × 1-3/4\" · flush wood · hollow metal frame · 20 min · set 04\". The hardware set number points to the list of hardware for that opening.","image":null,"alt":""}],"quiz":[{"id":"op-1","prompt":"On a pair of doors, which leaf carries the lock or exit device and opens first?","options":["The inactive leaf","The active leaf","The astragal leaf","Either leaf"],"answer":1,"explain":"The active leaf is the one people use every day; the inactive leaf is bolted shut until needed."},{"id":"op-2","prompt":"What size is a door listed as 3070?","options":["3'-0\" wide × 7'-0\" high","30\" wide × 70\" high","7'-0\" wide × 3'-0\" high","3'-7\" wide × 7'-0\" high"],"answer":0,"explain":"The first two digits are feet and inches of width, the last two are feet and inches of height."},{"id":"op-3","prompt":"What is the standard thickness of a commercial door?","options":["1-3/8\"","1-1/2\"","1-3/4\"","2-1/4\""],"answer":2,"explain":"Commercial doors are 1-3/4\" thick; 1-3/8\" is typical of residential interior doors."},{"id":"op-4","prompt":"From which side of a door can you see the hinge knuckles?","options":["The push side","The pull side","Both sides equally","Neither side"],"answer":1,"explain":"The knuckles sit on the side the door swings toward, the pull side."}]},{"id":"door-types","title":"Door types and cores","minutes":5,"cards":[{"title":"Four common door types","body":"**Hollow metal** doors have steel faces over a core and show up at stairs, back-of-house rooms and many fire-rated openings. **Flush wood** doors have veneer or laminate faces and suit offices, patient rooms and hotels. **Aluminum stile-and-rail** doors frame large glass panels at storefront entrances. **FRP** (fiberglass-reinforced plastic) doors resist moisture and chemicals in pools, kitchens and labs.","image":null,"alt":""},{"title":"Hollow metal door levels","body":"The Steel Door Institute groups steel doors into four levels by face thickness. **Level 1** (20 gauge) is light commercial, **Level 2** (18 gauge) is heavy duty, **Level 3** (16 gauge) is extra heavy duty and **Level 4** (14 gauge) is maximum duty. A **lower gauge number means thicker steel**, so a 16-gauge door is tougher than an 18-gauge door.","image":null,"alt":""},{"title":"Inside a wood door","body":"**Particleboard** cores are the everyday choice and come non-rated or rated 20 or 45 minutes. **Structural composite lumber (SCL)** is stronger and more durable. **Staved lumber** uses glued wood blocks and is less common now. **Mineral** cores are used for 45-, 60- and 90-minute wood fire doors, but they hold screws poorly, so the door needs **wood blocking** where hardware mounts.","image":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NjAgMzAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idCI+CiAgPHRpdGxlIGlkPSJ0Ij5Gb3VyIHdvb2QgZG9vciBjb3JlIHR5cGVzIGluIGN1dGF3YXk8L3RpdGxlPgogIDxkZWZzPgogICAgPHBhdHRlcm4gaWQ9InBiIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPgogICAgICA8cmVjdCB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiNlM2NmYTgiLz4KICAgICAgPGNpcmNsZSBjeD0iMiIgY3k9IjMiIHI9IjEuMiIgZmlsbD0iI2E4OGE1YyIvPjxjaXJjbGUgY3g9IjciIGN5PSI3IiByPSIxIiBmaWxsPSIjOGY3MzQ3Ii8+PGNpcmNsZSBjeD0iNiIgY3k9IjIiIHI9Ii44IiBmaWxsPSIjYjg5YTZhIi8+PGNpcmNsZSBjeD0iMyIgY3k9IjgiIHI9Ii45IiBmaWxsPSIjOWM3ZjUyIi8+CiAgICA8L3BhdHRlcm4+CiAgICA8cGF0dGVybiBpZD0ic2NsIiB3aWR0aD0iNDAiIGhlaWdodD0iOCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+CiAgICAgIDxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI4IiBmaWxsPSIjZThkMmE2Ii8+CiAgICAgIDxwYXRoIGQ9Ik0wIDIgSDI0IE0xMCA1IEg0MCBNMCA3IEgxNCIgc3Ryb2tlPSIjYTc4MDRjIiBzdHJva2Utd2lkdGg9IjEuNCIvPgogICAgPC9wYXR0ZXJuPgogICAgPHBhdHRlcm4gaWQ9InN0YXZlIiB3aWR0aD0iMzYiIGhlaW o8L3N2Zz4K","alt":"Cutaway sections of particleboard, structural composite lumber, staved lumber and mineral wood door cores"},{"title":"Storefront doors","body":"Aluminum entrance doors are named by stile width: **narrow** (about 2\"), **medium** (about 3-1/2\") and **wide** (about 5\"). Narrow stiles leave little room for hardware, so they need narrow-stile exit devices and short backset locks. Kawneer's 190, 350 and 500 doors are common examples.","image":null,"alt":""},{"title":"Choosing the door","body":"Start with the room. A stair door needs a fire rating and durability, so it is usually **hollow metal**. An office or patient room usually gets **flush wood** for its finish. A main entrance with glass uses **aluminum stile-and-rail**, and a pool or wash-down area gets **FRP**.","image":null,"alt":""}],"quiz":[{"id":"dt-1","prompt":"Which steel door face is thicker, 16 gauge or 18 gauge?","options":["16 gauge","18 gauge","They are the same","It depends on the core"],"answer":0,"explain":"Gauge numbers run backwards; the lower number is thicker steel."},{"id":"dt-2","prompt":"Which wood door core is used for 60- and 90-minute fire ratings?","options":["Particleboard","Staved lumber","Mineral","Honeycomb"],"answer":2,"explain":"Mineral cores provide 45-, 60- and 90-minute ratings in wood doors."},{"id":"dt-3","prompt":"Why does a mineral-core door need wood blocking?","options":["To add a fire rating","Because mineral cores hold screws poorly","To make the door lighter","To reduce sound transmission"],"answer":1,"explain":"Blocking gives hinge, lock and closer screws something solid to bite into."},{"id":"dt-4","prompt":"Which door type fits a natatorium (indoor pool) best?","options":["Flush wood","Level 1 hollow metal","FRP","Narrow-stile aluminum"],"answer":2,"explain":"FRP doors stand up to constant moisture and pool chemicals."}]},{"id":"frames","title":"Frames","minutes":5,"cards":[{"title":"Frame anatomy","body":"A frame has a **head** across the top and t op in the middle with a rabbet on each side, so the frame works with the door on either face of the wall. A **single rabbet** frame has one rabbet. A **cased opening** has no stop at all and frames a passage without a door.","image":null,"alt":""},{"title":"Welded vs. knock-down","body":"**Welded** frames arrive in one piece and are set before the wall is built. They are the most rigid choice, typical for masonry and high-traffic openings. **Knock-down** frames ship in pieces and can slip over finished drywall, which is faster, especially in renovations, but less rigid.","image":null,"alt":""},{"title":"Anchoring the frame","body":"Frames are tied to the wall with **anchors** matched to it: masonry anchors set in block or brick, **stud anchors** for metal or wood studs, and **existing wall anchors** that bolt through into finished walls. **Base anchors** fasten the jambs to the floor. A loose frame lets the door sag and the latch miss the strike.","image":null,"alt":""},{"title":"Matching frame to door","body":"Frame steel should be at least as heavy as the door calls for: SDI pairs Level 1 doors with 18-gauge frames, Level 2 with 16-gauge and Levels 3 and 4 with 14-gauge. Fire-rated openings need a **labeled frame** too, not just a labeled door.","image":null,"alt":""}],"quiz":[{"id":"fr-1","prompt":"What part of the frame does the door close against?","options":["The soffit","The return","The stop","The throat"],"answer":2,"explain":"The stop is the raised strip the door leaf closes against."},{"id":"fr-2","prompt":"A renovation adds a door to an existing, finished drywall wall. Which frame is usually easiest?","options":["Welded frame","Knock-down drywall frame","Cased opening","Masonry frame"],"answer":1,"explain":"Knock-down frames slip over finished drywall without rebuilding the wall."},{"id":"fr-3","prompt":"Which frame has a stop with a rabbet on each side?","options":["Single rabbet","Double rabbet","Cased opening","Borrowed light"],"answer":1,"explain":"Double-rabbet frames are the most common hollow metal frame profile."},{"id":"fr-4","prompt":"What frame gauge does SDI pair with a Level 3 (16-gauge) door?","options":["20 gauge","18 gauge","16 gauge","14 gauge"],"answer":3,"explain":"Level 3 and Level 4 doors call for 14-gauge frames."}]},{"id":"handing-bevel","title":"Handing, swing and bevel","minutes":4,"cards":[{"title":"Find the hand","body":"Stand on the **outside**, the keyed or secure side. Hinges on your left and the door swinging away from you: **left hand (LH)**. Hinges on the right: **right hand (RH)**. If the door swings toward you, add \"reverse\": **LHR** or **RHR**.","image":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MjAgMzYwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idCI+CiAgPHRpdGxlIGlkPSJ0Ij5Eb29yIGhhbmRpbmcgdmlld2VkIGZyb20gdGhlIG91dHNpZGU8L3RpdGxlPgogIDxzdHlsZT4KICAgIC53YWxse2ZpbGw6IzlhYTViMX0KICAgIC5kb29ye3N0cm9rZTojM2I0NzUyO3N0cm9rZS13aWR0aDo1O3N0cm9rZS1saW5lY2FwOnJvdW5kfQogICAgLmFyY3tmaWxsOm5vbmU7c3Ryb2tlOiNjMjQxMGM7c3Ryb2tlLXdpZHRoOjEuNTtzdHJva2UtZGFzaGFycmF5OjQgNH0KICAgIC5oaW5nZXtmaWxsOiNjMjQxMGN9CiAgICAubGJse2ZvbnQ6NzAwIDE2cHggc3lzdGVtLXVpLHNhbnMtc2VyaWY7ZmlsbDojMWYyOTMzfQogICAgLnN1Yntmb250OjEycHggc3lzdGVtLXVpLHNhbnMtc2VyaWY7ZmlsbDojNTI2MDZkfQogICAgLnlvdXtmb250OjYwMCAxMXB4IHN5c3RlbS11aSxzYW5zLXNlcmlmO2ZpbGw6IzBiNmU0Zn0KICA8L3N0eWxlPgogIDwhLS0gUGxhbiB2aWV3cy4gV2FsbCBpcyBob3Jpem9udGFsOyBJTlNJREUgaXMgYWJvdmUgdGhlIHdhbGwsIE9VVFNJREUgKHdoZXJlIHlvdSBzdGFuZCkgaXMgYmVsb3cuIC0tPgogIDwhLS0gTEg6IGhpbmdlIGxlZnQsIHN3aW5ncyBhd2F5ICh1cCwgaW50byBpbnNpZGUpIC0tPgogIDxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDIwLDIwKSI+CiAgICA8cmVjdCBjbGFzcz0id2FsbCIgeD0iMCIgeT0iMTAwIiB3aWR0aD0iMjAiIGhlaWdodD0iMTAiLz48cmVjdCBjbGFzcz0id2FsbCIgeD0iMTAwIiB5PSIxMDAiIHdpZHRoPSIyMCIgaGVpZ2h0PSIxMCIvPgogICAgPGxpbmUgY2xhc3M9ImRvb3IiIHgxPSIyMCIgeTE9IjEwMCIgeDI9IjIwIiB5Mj0iMjAiLz4KICAgIDxwYXRoIGNsYXNzPSJhcmMiIGQ9Ik0xMDAgMTAwIEE4MCA4MCAwIDAgMCAyMCAyMCIvPgogICAgPGNpcmNsZSBjbGFzcz0iaGluZ2UiIGN4PSI leaf**. If the active leaf on your right swings toward you from the secure side, the pair is **RHR active**. Get the active leaf right, because it carries the lock or exit device.","image":null,"alt":""}],"quiz":[{"id":"hb-1","prompt":"From the secure side, the hinges are on your left and the door swings toward you. What is the hand?","options":["LH","RH","LHR","RHR"],"answer":2,"explain":"Hinges left plus swinging toward you is left hand reverse."},{"id":"hb-2","prompt":"How much is a standard door edge beveled?","options":["1/16\" in 2\"","1/8\" in 2\"","1/4\" in 2\"","1/2\" in 2\""],"answer":1,"explain":"The standard bevel is 1/8\" in 2\", so the lock edge clears the frame."},{"id":"hb-3","prompt":"An exterior exit door swings out. Which hinge option keeps someone outside from pulling the pins?","options":["Swing-clear","Spring hinge","NRP (non-removable pin)","Electric hinge"],"answer":2,"explain":"Non-removable pins stop the door being lifted off from the outside."},{"id":"hb-4","prompt":"How is a pair of doors handed?","options":["By the inactive leaf","By the active leaf","By the wider leaf","Pairs have no hand"],"answer":1,"explain":"The pair takes the hand of its active leaf, the one with the lock or device."}]},{"id":"fire-rated","title":"Fire-rated openings 101","minutes":6,"cards":[{"title":"Why fire doors exist","body":"Fire-rated walls split a building into **compartments** that hold back fire and smoke. A door in that wall must hold back fire too, so it is a **fire door assembly**: the door, frame, hardware and any glass are all listed for the rating. **NFPA 80** sets how fire doors are installed, inspected and maintained.","image":null,"alt":""},{"title":"Which rating goes where","body":"Ratings are in minutes or hours. Typical pairings: **3-hour** doors in fire walls that separate buildings, **90-minute** doors in 2-hour walls around stairs and shafts, **60-minute** doors in 1-hour stair and shaft enclosures, **45-minute** doors in other 1-hour walls, and **20-minute** doors in 1-hour corridor walls, where smoke is the main concern. Codes set the exact rating; this is the pattern.","image":null,"alt":""},{"title":"Reading the labels","body":"Every fire door and frame carries a **label** from a testing agency. The door label is usually on the **hinge edge between the top and middle hinges**; the frame label is in the **rabbet**, also between the top and middle hinges. An **\"S\"** after the rating means the door is also tested for smoke and draft control.","image":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NjAgMzQwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idCI+CiAgPHRpdGxlIGlkPSJ0Ij5XaGVyZSBmaXJlIGxhYmVscyBnbyBvbiB0aGUgZG9vciBlZGdlIGFuZCBmcmFtZSByYWJiZXQ8L3RpdGxlPgogIDxzdHlsZT4KICAgIC5lZGdle2ZpbGw6I2YzZWFkOTtzdHJva2U6IzZiNWI0NTtzdHJva2Utd2lkdGg6Mn0KICAgIC5qYW1ie2ZpbGw6I2NmZDZkZDtzdHJva2U6IzNiNDc1MjtzdHJva2Utd2lkdGg6Mn0KICAgIC5yYWJiZXR7ZmlsbDojYjZiZmM4O3N0cm9rZTojM2I0NzUyO3N0cm9rZS13aWR0aDoxLjV9CiAgICAuaGluZ2V7ZmlsbDojM2I0NzUyfQogICAgLnRhZ3tmaWxsOiNjMjQxMGM7c3Ryb2tlOiM4YTJlMDg7c3Ryb2tlLXdpZHRoOjF9CiAgICAuY2FyZHtmaWxsOiNmZmY7c3Ryb2tlOiMzYjQ3NTI7c3Ryb2tlLXdpZHRoOjJ9CiAgICAubG57c3Ryb2tlOiNjMjQxMGM7c3Ryb2tlLXdpZHRoOjEuNTtmaWxsOm5vbmV9CiAgICAuZG90e2ZpbGw6I2MyNDEwY30KICAgIC5sYmx7Zm9udDo3MDAgMTRweCBzeXN0ZW0tdWksc2Fucy1zZXJpZjtmaWxsOiMxZjI5MzN9CiAgICAuc3Vie2ZvbnQ6MTJweCBzeXN0ZW0tdWksc2Fucy1zZXJpZjtmaWxsOiM1MjYwNmR9CiAgICAubW9ub3tmb250OjcwMCAxMnB4IHVpLW1vbm9zcGFjZSxNZW5sbyxDb25zb2xhcyxtb25vc3BhY2U7ZmlsbDojMWYyOTMzfQogIDwvc3R5bGU+CiAgPCEtLSBEb29yIGhpbmdlIGVkZ2UgLS0+CiAgPHJlY3QgY2xhc3M9ImVkZ2UiIHg9IjYwIiB5PSIyMCIgd2lkdGg9IjQ0IiBoZWlnaHQ9IjI4MCIvPgogIDxyZWN0IGNsYXNzPSJoaW5nZSIgeD0iNjIiIHk9IjQwIiB3aWR0aD0iNDAiIGhlaWdodD0iMTAiLz4KICA8cmVjdCBjbGFzcz0iaGluZ2UiIHg9IjYyIiB5PSIxNTAiIHdpZHRoPSI0MCIgaGVpZ2h0PSIxMCIvPgogIDxyZWN0IGNsYXNzPSJoaW5nZSIgeD0iNjIiIHk9IjI2MiIgd2lkdGg9IjQwIiBoZWlnaHQ9IjEwIi8+CiAgPHJlY3QgY2xhc3M9InRhZyIgeD0iNzAiIHk9Ijg4IiB3aWR0aD0iMjQiIGhlaWdodD0iMzAiIHJ4PSIy What is the maximum gap under a typical swinging fire door?","options":["1/4\"","1/2\"","3/4\"","1\""],"answer":2,"explain":"NFPA 80 allows up to 3/4\" at the bottom for most swinging fire doors."},{"id":"fd-4","prompt":"What does an \"S\" after a fire door's rating mean?","options":["It is steel","It is rated for smoke and draft control","It is for stairwells only","It has a sprinkler exemption"],"answer":1,"explain":"The S label means the assembly was also tested for smoke and draft leakage."}]}],"segment_quiz":[{"id":"u1-1","prompt":"An office corridor has 1-hour walls. What fire rating does a typical door in that corridor wall need?","options":["20 minutes","45 minutes","90 minutes","3 hours"],"answer":0,"explain":"Corridor walls usually take 20-minute doors, where smoke control is the main concern."},{"id":"u1-2","prompt":"A stair in a six-story building has 2-hour walls. What door rating do you expect?","options":["20 minutes","45 minutes","90 minutes","No rating"],"answer":2,"explain":"Doors in 2-hour stair and shaft walls are typically 90-minute (1-1/2 hour) doors."},{"id":"u1-3","prompt":"A fire door at a back-of-house corridor is propped open with a wooden wedge and has a 1\" gap at the floor. How many problems is that?","options":["None","One","Two","Three"],"answer":2,"explain":"The wedge stops it self-closing, and a 1\" gap exceeds the 3/4\" bottom limit."},{"id":"u1-4","prompt":"Standing outside a building, the hinges of an exit door are on your right and it swings toward you. What is the hand, and what hinge option does it need?","options":["RH with spring hinges","RHR with NRP hinges","LHR with NRP hinges","RH with swing-clear hinges"],"answer":1,"explain":"Hinges right plus swinging toward you is RHR, and exposed pins call for NRP hinges."},{"id":"u1-5","prompt":"A busy school stair door gets slammed by carts all day. Which door and frame combination fits best?","options":["Level 1 (20 ga) door in an 18 ga frame","Level 3 (16 ga) door in a 14 ga frame","Particleboard wood door in a knock-down frame","Narrow-stile aluminum door"],"answer":1,"explain":"Heavy abuse calls for an extra-heavy-duty door in a 14-gauge welded frame."},{"id":"u1-6","prompt":"A 45-minute wood door gets a new closer, but the screws keep pulling out of the core. What was missed?","options":["The door needed a smoke label","The mineral core needed wood blocking at the closer","The frame was the wrong gauge","The bevel was cut the wrong way"],"answer":1,"explain":"Mineral cores hold screws poorly; hardware locations need blocking."}]},{"id":"hinges","title":"Hanging the Door","subtitle":"Hinges, continuous hinges and pivots","pass_mark":0.7,"segment_quiz_size":8,"lessons":[{"id":"hinge-anatomy","title":"Anatomy of a butt hinge","minutes":4,"cards":[{"title":"The parts","body":"A butt hinge is two flat **leaves** joined by interlocking **knuckles**. A **pin** runs through the knuckles to form the **barrel**, and **tips** cap each end of the barrel. One leaf screws to the door edge, the other to the frame.","image":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0ODAgMzAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idCI+CiAgPHRpdGxlIGlkPSJ0Ij5CdXR0IGhpbmdlIGFuYXRvbXk8L3RpdGxlPgogIDxzdHlsZT4KICAgIC5sZWFme2ZpbGw6I2NmZDZkZDtzdHJva2U6IzNiNDc1MjtzdHJva2Utd2lkdGg6Mn0KICAgIC5rbnVja2xle2ZpbGw6I2FlYjhjMjtzdHJva2U6IzNiNDc1MjtzdHJva2Utd2lkdGg6Mn0KICAgIC5ob2xle2ZpbGw6I2ZmZjtzdHJva2U6IzNiNDc1MjtzdHJva2Utd2lkdGg6MS41fQogICAgLmxibHtmb250OjYwMCAxNHB4IHN5c3RlbS11aSxzYW5zLXNlcmlmO2ZpbGw6IzFmMjkzM30KICAgIC5sbntzdHJva2U6I2MyNDEwYztzdHJva2Utd2lkdGg6MS41O2ZpbGw6bm9uZX0KICAgIC5kb3R7ZmlsbDojYzI0MTBjfQogIDwvc3R5bGU+CiAgPCEtLSBsZWF2ZXMgLS0+CiAgPHJlY3QgY2xhc3M9ImxlYWYiIHg9IjEyMCIgeT0iNTAiIHdpZHRoPSIxMDQiIGhlaWdodD0iMjAwIiByeD0iNCIvPgogIDxyZWN0IGNsYXNzPSJsZWFmIiB4PSIyNTYiIHk9IjUwIiB3aWR0aD0iMTA0IiBoZWlnaHQ9IjIwMCIgcng9IjQiLz4KICA8IS0tIGtudWNrbGVzOiBmaXZlLCBhbHRlcm5hdGluZyAtLT4KICA8cmVjdCBjbGFzcz0ia251Y2tsZSIgeD0iMjI0IiB5PSI1MCI ial doors","Whenever the finish is stainless steel"],"answer":1,"explain":"Thicker heavy-weight leaves stand up to heavy doors and frequent use."}]},{"id":"hinge-types","title":"Mounting types and alternatives","minutes":5,"cards":[{"title":"Four mounting types","body":"ANSI/BHMA A156.1 groups butt hinges by how each leaf attaches. **Full mortise**: both leaves are cut into the door edge and frame — the most common commercial hinge. **Half mortise**: mortised into the door edge, surface-mounted on the frame. **Half surface**: mortised into the frame, surface-mounted on the door face. **Full surface**: both leaves on the surface.","image":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MjAgMzAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idCI+CiAgPHRpdGxlIGlkPSJ0Ij5QbGFuIHZpZXdzIG9mIGZvdXIgaGluZ2UgbW91bnRpbmcgdHlwZXM8L3RpdGxlPgogIDxzdHlsZT4KICAgIC5mcmFtZXtmaWxsOiNlOGRjYzg7c3Ryb2tlOiM2YjViNDU7c3Ryb2tlLXdpZHRoOjEuNX0KICAgIC5kb29ye2ZpbGw6I2YzZWFkOTtzdHJva2U6IzZiNWI0NTtzdHJva2Utd2lkdGg6MS41fQogICAgLmxlYWZ7ZmlsbDojM2I0NzUyfQogICAgLmtudWNrbGV7ZmlsbDojM2I0NzUyfQogICAgLmxibHtmb250OjcwMCAxNHB4IHN5c3RlbS11aSxzYW5zLXNlcmlmO2ZpbGw6IzFmMjkzM30KICAgIC5zdWJ7Zm9udDoxMnB4IHN5c3RlbS11aSxzYW5zLXNlcmlmO2ZpbGw6IzUyNjA2ZH0KICA8L3N0eWxlPgogIDwhLS0gRWFjaCBwYW5lbDogZnJhbWUgamFtYiBvbiBsZWZ0LCBkb29yIG9uIHJpZ2h0LCBzZWVuIGZyb20gYWJvdmUuIExlYWYgaW4gYSBtb3J0aXNlID0gaW5zZXQgaW50byB0aGUgZWRnZS4gLS0+CiAgPCEtLSAxIEZ1bGwgbW9ydGlzZSAtLT4KICA8ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgyMCw0MCkiPgogICAgPHJlY3QgY2xhc3M9ImZyYW1lIiB4PSIwIiB5PSIyMCIgd2lkdGg9IjQwIiBoZWlnaHQ9IjcwIi8+CiAgICA8cmVjdCBjbGFzcz0iZG9vciIgeD0iNDYiIHk9IjIwIiB3aWR0aD0iNjAiIGhlaWdodD0iNzAiLz4KICAgIDxyZWN0IGNsYXNzPSJsZWFmIiB4PSIzNCIgeT0iMzAiIHdpZHRoPSI2IiBoZWlnaHQ9IjQwIi8+CiAgICA8cmVjdCBjbGFzcz0ibGVhZiIgeD0iNDYiIHk9IjMwIiB3aWR0aD0iNiIgaGVpZ2h0PSI0MCIvPgogICAgPGNpcmNsZSBjbGFzcz0ia251Y2tsZSIgY3g9IjQzIiBjeT0iMjAiIHI9IjYiLz4KICAgIDx0ZXh0IGNsYXNzPSJsYmwiIHg9IjAiIHk9IjEyNSI+RnVsbCBtb3J0aXNlPC90ZXh0PgogICAgPHRleHQ ckage fits best?","options":["3 plain-bearing standard weight hinges","4 ball-bearing heavy weight hinges","2 spring hinges","3 full surface plain-bearing hinges"],"answer":1,"explain":"96\" falls in the 90\"–120\" band, so four hinges; a closer and heavy traffic call for ball-bearing, heavy-weight leaves."},{"id":"sq-2","prompt":"A hospital room needs the full door width clear for beds. Which hinge addresses that?","options":["NRP hinge","Swing-clear hinge","Half mortise hinge","Olive knuckle hinge"],"answer":1,"explain":"Swing-clear hinges move the door completely out of the opening."},{"id":"sq-3","prompt":"A school entrance door sees constant abuse and its butt hinges keep sagging. What is a common upgrade?","options":["A continuous hinge","Fewer hinges","Plain-bearing hinges","A spring hinge"],"answer":0,"explain":"Continuous hinges spread the load along the full height of the door."},{"id":"sq-4","prompt":"You order a two-knuckle hinge for a door. What extra information must the order include?","options":["The door hand","The BHMA grade of the lock","The closer size","Nothing extra"],"answer":0,"explain":"Two-knuckle hinges are handed, unlike most five-knuckle template hinges."}]}];
const KEY = "door-hardware-academy-v1";
const ROLES = ["Architect or designer", "Hardware consultant or specifier", "Distributor or sales",
  "Contractor or installer", "Facilities or security", "Student", "Other"];

/* ---------- saved state (this browser) ---------- */
function blank() { return { profile: null, passed: {}, units: {}, days: [], quizzes: 0, scoreSum: 0 }; }
let S = blank();
let storageOK = true;
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); }
catch (e) { storageOK = false; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const $top = document.getElementById("topbar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const pct = v => Math.round(v * 100) + "%";
const localDay = (d = new Date()) => d.toLocaleDateString("en-CA");
let flash = "";

function streak() {
  const days = new Set(S.days);
  const d = new Date();
  if (!days.has(localDay(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(localDay(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* Units open in order; lessons open in order inside a unit (same rules as the Flask app). */
function course() {
  let prevPassed = true;
  return COURSE.map((seg, i) => {
    const unlocked = prevPassed;
    let prevDone = true;
    const lessons = seg.lessons.map(l => {
      let state = S.passed[seg.id + "/" + l.id] ? "done" : (prevDone && unlocked ? "next" : "locked");
      prevDone = state === "done";
      return { lesson: l, state };
    });
    const done = lessons.filter(x => x.state === "done").length;
    const u = S.units[seg.id] || {};
    const sp = { seg, number: i + 1, unlocked, lessons, done,
      quizUnlocked: unlocked && done === lessons.length, quizPassed: !!u.passed, best: u.best ?? null };
    sp.fraction = (done + (sp.quizPassed ? 1 : 0)) / (lessons.length + 1);
    sp.nextLesson = unlocked ? (lessons.find(x => x.state === "next") || {}).lesson : null;
    prevPassed = sp.quizPassed;
    return sp;
  });
}
const unitById = id => course().find(sp => sp.seg.id === id);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildUnitQuiz(seg) {
  const size = seg.segment_quiz_size;
  const chosen = seg.segment_quiz.slice(0, size);
  const pools = seg.lessons.map(l => shuffle(l.quiz.slice()));
  while (chosen.length < size && pools.some(p => p.length))
    for (const p of pools) if (p.length && chosen.length < size) chosen.push(p.pop());
  return shuffle(chosen);
}

/* ---------- routing: #/ , #/l/seg/lesson/n , #/q/seg/lesson , #/u/seg , #/profile , #/start ---------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener("hashchange", route);

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const [view, a, b, c] = parts;
  document.body.className = "";
  if (view === "l") return cardView(a, b, parseInt(c || "1", 10));
  if (view === "q") return quizView(a, b);
  if (view === "u") return quizView(a, null);
  if (view === "profile") return profileView();
  if (view === "start") return startView();
  return homeView();
}

function topbar(extra = "") {
  const right = S.profile
    ? `<button class="avatar" type="button" data-go="#/profile" aria-label="Your profile, ${esc(S.profile.name)}">${esc(S.profile.name.slice(0, 1).toUpperCase())}</button>`
    : `<a class="signin" href="#/start">Create profile</a>`;
  $top.innerHTML = `<button class="brand" type="button" data-go="#/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Door Hardware Academy</span></button>
    <div class="topbar-right">${extra}${right}</div>`;
}
function focusTop(inner) { document.body.className = "focus"; $top.innerHTML = inner; }

function show(html) {
  const f = flash ? `<p class="flash" role="status">${esc(flash)}</p>` : "";
  flash = "";
  $app.innerHTML = f + html;
  window.scrollTo(0, 0);
  const h = $app.querySelector("h1");
  if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
}
function guard(sp, lessonId) {
  if (!sp) { flash = "That page doesn't exist."; go("#/"); return null; }
  if (!sp.unlocked) { flash = `Pass the Unit ${sp.number - 1} quiz to unlock Unit ${sp.number}.`; go("#/"); return null; }
  if (lessonId) {
    const st = sp.lessons.find(x => x.lesson.id === lessonId);
    if (!st) { flash = "That lesson doesn't exist."; go("#/"); return null; }
    if (st.state === "locked") { flash = "Finish the earlier lessons first to unlock that one."; go("#/"); return null; }
    return st.lesson;
  }
  return true;
}

/* ---------- views ---------- */
function homeView() {
  const units = course();
  topbar(`<span class="streak" title="Days in a row with a passed quiz"><span aria-hidden="true">▲</span> ${streak()}<span class="streak-word">-day streak</span><span class="sr"> day streak</span></span>`);
  let today = null;
  for (const sp of units) {
    if (sp.nextLesson) { today = ["lesson", sp, sp.nextLesson]; break; }
    if (sp.quizUnlocked && !sp.quizPassed) { today = ["quiz", sp]; break; }
  }
  let h = "";
  if (today && today[0] === "lesson") {
    const [, sp, l] = today;
    h += `<section class="today"><p class="eyebrow">Today's lesson · Unit ${sp.number}</p><h1>${esc(l.title)}</h1>
      <p class="muted">${esc(sp.seg.title)} · about ${l.minutes} minutes · ends with a short quiz</p>
      <button class="btn block-sm" data-go="#/l/${sp.seg.id}/${l.id}/1">Start lesson</button></section>`;
  } else if (today) {
    const sp = today[1];
    h += `<section class="today"><p class="eyebrow">Today's lesson · Unit ${sp.number}</p><h1>Unit ${sp.number} quiz: ${esc(sp.seg.title)}</h1>
      <p class="muted">You've finished every lesson in this unit. Pass the quiz to unlock the next one.</p>
      <button class="btn block-sm" data-go="#/u/${sp.seg.id}">Take the unit quiz</button></section>`;
  } else {
    h += `<section class="today"><p class="eyebrow">All caught up</p><h1>You've completed every unit available.</h1>
      <p class="muted">Retake any quiz to keep your streak going while new units are written.</p></section>`;
  }
  if (!S.profile) {
    h += `<section class="save-nudge"><div><strong>Create your profile</strong>
      <p>Add your name to track lessons, scores and your streak. Progress saves in this browser; a transfer code moves it to your phone.</p></div>
      <div class="save-actions"><button class="btn small" data-go="#/start">Create profile</button></div></section>`;
  }
  for (const sp of units) {
    h += `<section class="segment ${sp.unlocked ? "" : "is-locked"}"><div class="segment-head"><div>
      <p class="eyebrow">Unit ${sp.number}${sp.unlocked ? "" : " · locked"}</p><h2>${esc(sp.seg.title)}</h2><p class="muted">${esc(sp.seg.subtitle)}</p></div>
      <p class="count">${sp.done} / ${sp.lessons.length} lessons</p></div>
      <div class="meter" role="progressbar" aria-label="Unit ${sp.number} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(sp.fraction * 100)}"><span style="width:${Math.round(sp.fraction * 100)}%"></span></div>
      ${sp.unlocked ? "" : `<p class="muted small-note">Pass the Unit ${sp.number - 1} quiz to open this unit.</p>`}
      <ol class="path">`;
    sp.lessons.forEach((x, i) => {
      h += `<li class="node ${x.state}"><span class="dot" aria-hidden="true">${x.state === "done" ? "✓" : i + 1}</span>` +
        (x.state === "locked"
          ? `<span class="node-title">${esc(x.lesson.title)} <span class="sr">(locked)</span></span>`
          : `<button class="node-title btnlike" data-go="#/l/${sp.seg.id}/${x.lesson.id}/1">${esc(x.lesson.title)}${x.state === "done" ? '<span class="sr"> (done)</span>' : ""}</button>`) + `</li>`;
    });
    const qs = sp.quizPassed ? "done" : sp.quizUnlocked ? "next" : "locked";
    h += `<li class="node quiz ${qs}"><span class="dot" aria-hidden="true">★</span>` +
      (sp.quizUnlocked
        ? `<button class="node-title btnlike" data-go="#/u/${sp.seg.id}">Unit quiz</button>${sp.best != null ? `<span class="best">best ${pct(sp.best)}</span>` : ""}`
        : `<span class="node-title">Unit quiz <span class="sr">(locked)</span></span>`) + `</li></ol></section>`;
  }
  if (!storageOK) h += `<p class="flash">This browser is blocking storage, so progress won't be kept after you close the page.</p>`;
  h += `<p class="footer">Lessons are for training. Always confirm requirements with the codes your jurisdiction has adopted.</p>`;
  show(h);
}

function cardView(segId, lessonId, n) {
  const sp = unitById(segId);
  const lesson = guard(sp, lessonId);
  if (!lesson) return;
  const total = lesson.cards.length;
  if (!(n >= 1 && n <= total)) { go(`#/l/${segId}/${lessonId}/1`); return; }
  const card = lesson.cards[n - 1];
  focusTop(`<button class="close" type="button" data-go="#/" aria-label="Leave lesson and go home">✕</button>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="Card ${n} of ${total}"><span style="width:${Math.round(n / (total + 1) * 100)}%"></span></div>
    <span class="step">${n}/${total}</span>`);
  document.body.className = "focus";
  show(`<article class="card"><p class="eyebrow">Unit ${sp.number} · ${esc(lesson.title)}</p><h1>${esc(card.title)}</h1>
    ${card.image ? `<figure><a href="${card.image}" target="_blank" rel="noopener" class="zoom"><img src="${card.image}" alt="${esc(card.alt || "")}"></a><figcaption>Tap the diagram to open it full size.</figcaption></figure>` : ""}
    <p class="body">${bold(card.body)}</p></article>
    <nav class="action-bar">
      ${n > 1 ? `<button class="btn ghost" data-go="#/l/${segId}/${lessonId}/${n - 1}">Back</button>` : `<button class="btn ghost" data-go="#/">Home</button>`}
      ${n < total ? `<button class="btn" data-go="#/l/${segId}/${lessonId}/${n + 1}">Next</button>` : `<button class="btn" data-go="#/q/${segId}/${lessonId}">Take the quiz</button>`}
    </nav>`);
}

let current = null;
function quizView(segId, lessonId) {
  const sp = unitById(segId);
  const ok = guard(sp, lessonId);
  if (!ok) return;
  const lesson = lessonId ? ok : null;
  if (!lesson && !sp.quizUnlocked) { flash = "Pass every lesson in this unit to unlock the unit quiz."; go("#/"); return; }
  const qs = lesson ? lesson.quiz : buildUnitQuiz(sp.seg);
  current = { sp, lesson, qs };
  const heading = lesson ? `Quick check: ${lesson.title}` : `Unit ${sp.number} quiz: ${sp.seg.title}`;
  focusTop(`<button class="close" type="button" data-go="#/" aria-label="Leave quiz and go home">✕</button>
    <span class="topbar-title">${lesson ? "Quick check" : `Unit ${sp.number} quiz`}</span><span class="step">${qs.length} Qs</span>`);
  document.body.className = "focus";
  show(`<h1>${esc(heading)}</h1><p class="muted">${qs.length} questions · pass with ${pct(sp.seg.pass_mark)} or better</p>
    <form class="quiz-form" id="quiz-form">
      ${qs.map((q, i) => `<fieldset class="question"><legend><span class="qnum">${i + 1}</span><span>${esc(q.prompt)}</span></legend>
        ${q.options.map((o, j) => `<label class="option"><input type="radio" id="${q.id}-${j}" name="${q.id}" value="${j}" required><span>${esc(o)}</span></label>`).join("")}
      </fieldset>`).join("")}
      <div class="action-bar"><button class="btn wide" type="submit">Check answers</button></div>
    </form>`);
  document.getElementById("quiz-form").addEventListener("submit", e => { e.preventDefault(); grade(new FormData(e.target)); });
}

function grade(fd) {
  const { sp, lesson, qs } = current;
  const fb = qs.map(q => { const v = fd.get(q.id); const c = v == null ? null : +v; return { q, chosen: c, ok: c === q.answer }; });
  const right = fb.filter(f => f.ok).length, score = right / fb.length, passed = score >= sp.seg.pass_mark;
  S.quizzes += 1; S.scoreSum += score;
  if (passed && !S.days.includes(localDay())) { S.days.push(localDay()); S.days = S.days.slice(-400); }
  if (lesson) { if (passed) S.passed[sp.seg.id + "/" + lesson.id] = true; }
  else {
    const u = S.units[sp.seg.id] || {};
    S.units[sp.seg.id] = { passed: !!u.passed || passed, best: Math.max(u.best ?? 0, score) };
  }
  save();
  const msg = passed ? (lesson ? "Lesson complete. The next one is unlocked." : "Unit complete. The next unit is unlocked.")
    : `You need ${pct(sp.seg.pass_mark)} to pass. Review the explanations and try again.`;
  topbar();
  document.body.className = "";
  const retry = lesson ? `#/q/${sp.seg.id}/${lesson.id}` : `#/u/${sp.seg.id}`;
  show(`<section class="score ${passed ? "pass" : "fail"}"><p class="eyebrow">${esc(lesson ? lesson.title : `Unit ${sp.number} quiz: ${sp.seg.title}`)}</p>
    <h1>${right} of ${fb.length} correct · ${pct(score)}</h1><p>${msg}</p>
    ${S.profile ? "" : `<p class="muted save-line"><a href="#/start">Create a profile</a> to see your stats and move progress between devices.</p>`}</section>
    <ol class="review">${fb.map(f => `<li class="${f.ok ? "right" : "wrong"}"><p class="q">${esc(f.q.prompt)}</p>
      ${f.ok ? `<p><strong>Correct:</strong> ${esc(f.q.options[f.q.answer])}</p>`
        : `<p><strong>Your answer:</strong> ${esc(f.chosen == null ? "No answer" : f.q.options[f.chosen])}</p><p><strong>Correct answer:</strong> ${esc(f.q.options[f.q.answer])}</p>`}
      ${f.q.explain ? `<p class="muted">${esc(f.q.explain)}</p>` : ""}</li>`).join("")}</ol>
    <nav class="action-bar"><button class="btn ghost" data-go="${retry}">Retake</button><button class="btn" data-go="#/">Continue</button></nav>`);
}

function roleOptions(selected) {
  return `<option value="">Choose one</option>` + ROLES.map(r => `<option ${r === selected ? "selected" : ""}>${esc(r)}</option>`).join("");
}

function startView() {
  if (S.profile) { go("#/profile"); return; }
  topbar();
  const hasProgress = Object.keys(S.passed).length > 0;
  show(`<section class="panel auth"><p class="eyebrow">Free profile</p><h1>Create your profile</h1>
    <p class="muted">${hasProgress ? "Lessons you've already finished here will be kept." : "Track your lessons, quiz scores and streak."} Your profile saves in this browser. No email or password needed.</p>
    <form class="form" id="start-form">
      <label for="p-name">Your name</label><input id="p-name" maxlength="40" autocomplete="name" required>
      <label for="p-role">Your work <span class="optional">(optional)</span></label><select id="p-role">${roleOptions("")}</select>
      <button class="btn wide" type="submit">Create profile</button>
    </form>
    <p class="switch">Already have a profile on another device? <a href="#/profile" data-import="1">Bring it over with a transfer code</a></p></section>`);
  document.getElementById("start-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("p-name").value.trim();
    if (!name) return;
    S.profile = { name, role: document.getElementById("p-role").value, since: localDay() };
    save(); flash = `Profile created. Welcome, ${name}!`; go("#/");
  });
}

function encodeTransfer() { return btoa(unescape(encodeURIComponent(JSON.stringify({ app: "dha", v: 1, state: S })))); }
function decodeTransfer(code) {
  const obj = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  if (!obj || obj.app !== "dha" || typeof obj.state !== "object") throw new Error("bad");
  return Object.assign(blank(), obj.state);
}

function profileView(importOnly) {
  topbar();
  const units = course();
  const lessonsDone = units.reduce((n, u) => n + u.done, 0), lessonsTotal = units.reduce((n, u) => n + u.lessons.length, 0);
  const unitsDone = units.filter(u => u.quizPassed).length;
  const avg = S.quizzes ? S.scoreSum / S.quizzes : null;
  const p = S.profile;
  const since = p && p.since ? new Date(p.since + "T12:00").toLocaleDateString("en-US", { month: "long", year: "numeric" }) : "";
  show(`${p ? `<section class="panel profile-head"><span class="avatar big" aria-hidden="true">${esc(p.name.slice(0, 1).toUpperCase())}</span>
      <div><h1>${esc(p.name)}</h1><p class="muted">${p.role ? esc(p.role) + " · " : ""}${since ? "member since " + since : ""}</p></div></section>`
      : `<section class="panel"><h1>Your progress</h1><p class="muted">You haven't created a profile yet. <a href="#/start">Create one</a>, or paste a transfer code below.</p></section>`}
    <section class="stats" aria-label="Your progress">
      <div class="stat"><span class="num">${streak()}</span><span class="label">day streak</span></div>
      <div class="stat"><span class="num">${lessonsDone}<small>/${lessonsTotal}</small></span><span class="label">lessons done</span></div>
      <div class="stat"><span class="num">${unitsDone}<small>/${units.length}</small></span><span class="label">units passed</span></div>
      <div class="stat"><span class="num">${avg == null ? "–" : pct(avg)}</span><span class="label">average score</span></div>
    </section>
    <section class="panel"><h2>Units</h2><ul class="unit-list">
      ${units.map(sp => `<li><div class="unit-row"><span><strong>Unit ${sp.number}</strong> · ${esc(sp.seg.title)}</span>
        <span class="unit-status">${sp.quizPassed ? `Passed${sp.best != null ? " · best " + pct(sp.best) : ""}` : !sp.unlocked ? "Locked" : `${sp.done}/${sp.lessons.length} lessons`}</span></div>
        <div class="meter" role="progressbar" aria-label="Unit ${sp.number} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(sp.fraction * 100)}"><span style="width:${Math.round(sp.fraction * 100)}%"></span></div></li>`).join("")}
    </ul><p class="muted small-note">${S.quizzes} quiz${S.quizzes === 1 ? "" : "zes"} taken across ${S.days.length} day${S.days.length === 1 ? "" : "s"} with a passed quiz.</p></section>
    ${p ? `<details class="panel"><summary>Edit profile</summary><form class="form" id="edit-form">
      <label for="e-name">Your name</label><input id="e-name" maxlength="40" value="${esc(p.name)}" required>
      <label for="e-role">Your work <span class="optional">(optional)</span></label><select id="e-role">${roleOptions(p.role)}</select>
      <button class="btn" type="submit">Save profile</button></form></details>` : ""}
    <details class="panel transfer" ${importOnly ? "open" : ""} id="transfer"><summary>Move progress to another device</summary>
      <p class="note">Progress saves in this browser. To continue on your phone or another computer, copy this code there and paste it under "Paste a code".</p>
      <label for="t-out" class="sr">Your transfer code</label><textarea id="t-out" readonly>${encodeTransfer()}</textarea>
      <div class="row-actions"><button class="btn small" type="button" id="t-copy">Copy code</button></div>
      <label for="t-in" style="display:block;font-weight:600;margin-top:1rem">Paste a code</label>
      <textarea id="t-in" placeholder="Paste a transfer code from another device"></textarea>
      <div class="row-actions"><button class="btn small" type="button" id="t-load">Load progress</button></div>
      <p class="note" id="t-msg" role="status"></p></details>
    <details class="panel"><summary>Start over</summary><p class="note">Erase your profile and all progress in this browser.</p>
      <div class="row-actions"><button class="btn ghost" type="button" id="r-ask">Erase progress</button></div>
      <div class="confirm" id="r-confirm" hidden><p>This can't be undone. Copy your transfer code first if you might want it back.</p>
      <div class="row-actions"><button class="btn" type="button" id="r-yes">Yes, erase everything</button><button class="btn ghost" type="button" id="r-no">Keep my progress</button></div></div></details>`);

  const edit = document.getElementById("edit-form");
  if (edit) edit.addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("e-name").value.trim();
    if (!name) return;
    S.profile.name = name; S.profile.role = document.getElementById("e-role").value;
    save(); flash = "Profile saved."; profileView();
  });
  document.getElementById("t-copy").addEventListener("click", () => {
    const ta = document.getElementById("t-out"), msg = document.getElementById("t-msg");
    const done = () => { msg.textContent = "Code copied. Paste it on your other device."; };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); msg.textContent = "Code selected. Copy it with your keyboard or long-press."; });
    else { ta.select(); msg.textContent = "Code selected. Copy it with your keyboard or long-press."; }
  });
  document.getElementById("t-load").addEventListener("click", () => {
    const msg = document.getElementById("t-msg");
    try {
      const incoming = decodeTransfer(document.getElementById("t-in").value);
      S = incoming; save(); flash = "Progress loaded from your transfer code."; profileView();
    } catch (e) { msg.textContent = "That code didn't work. Copy the whole code from your other device and try again."; }
  });
  document.getElementById("r-ask").addEventListener("click", () => { document.getElementById("r-confirm").hidden = false; });
  document.getElementById("r-no").addEventListener("click", () => { document.getElementById("r-confirm").hidden = true; });
  document.getElementById("r-yes").addEventListener("click", () => { S = blank(); save(); flash = "Progress erased."; go("#/"); });
}

document.addEventListener("click", e => {
  const imp = e.target.closest("[data-import]");
  if (imp) { e.preventDefault(); if (location.hash === "#/profile") profileView(true); else { location.hash = "#/profile"; setTimeout(() => profileView(true), 0); } return; }
  const b = e.target.closest("[data-go]");
  if (b) { e.preventDefault(); go(b.dataset.go); }
});
route();
  </script>
